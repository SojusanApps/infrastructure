termsTitle=Regulamin i informacja o przetwarzaniu danych osobowych
termsText=<h2>Regulamin korzystania z Sojusan Auth oraz informacja o przetwarzaniu danych osobowych</h2>\
<p>Niniejszy dokument określa zasady korzystania z usługi logowania i zakładania konta Sojusan Auth ("Usługa"), wspólnej dla aplikacji z rodziny Sojusan Apps ("Aplikacje Sojusan"), oraz informuje o sposobie przetwarzania danych osobowych zgodnie z Rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2016/679 ("RODO").</p>\
<h3>1. Administrator danych osobowych</h3>\
<p>Administratorem danych osobowych przetwarzanych w ramach Usługi jest Sojusan, kontakt: kontakt@sojusan.pl. Administrator nie wyznaczył Inspektora Ochrony Danych — we wszystkich sprawach dotyczących przetwarzania danych osobowych można kontaktować się bezpośrednio z Administratorem pod wskazanym adresem e-mail.</p>\
<h3>2. Zakładanie konta i korzystanie z Usługi</h3>\
<ul>\
<li>Utworzenie konta w Usłudze jest dobrowolne, ale niezbędne do korzystania z Aplikacji Sojusan.</li>\
<li>Z Usługi mogą korzystać osoby, które ukończyły 16. rok życia. Osoby poniżej 16. roku życia mogą założyć konto wyłącznie za zgodą rodzica lub opiekuna prawnego.</li>\
<li>Użytkownik zobowiązany jest podać prawdziwe dane oraz dbać o poufność danych umożliwiających dostęp do konta (hasło).</li>\
<li>Nazwa użytkownika (login) oraz pseudonim muszą być unikalne w ramach Usługi.</li>\
<li>Założenie konta wymaga akceptacji niniejszego dokumentu.</li>\
<li>Użytkownik może w dowolnym momencie usunąć swoje konto samodzielnie w panelu konta Sojusan Auth.</li>\
</ul>\
<h3>3. Jakie dane przetwarzamy i w jakim celu</h3>\
<p>W związku z korzystaniem z Usługi przetwarzamy następujące dane:</p>\
<ul>\
<li><strong>Nazwa użytkownika (login)</strong> — dane obowiązkowe. Cel: utworzenie i identyfikacja konta oraz uwierzytelnianie (logowanie) w Usłudze i we wszystkich Aplikacjach Sojusan, do których użytkownik się loguje. Podstawa prawna: art. 6 ust. 1 lit. b RODO (niezbędność do świadczenia usługi).</li>\
<li><strong>Adres e-mail</strong> — dane obowiązkowe. Cel: uwierzytelnianie, potwierdzenie założenia konta oraz wysyłka wiadomości związanych z bezpieczeństwem konta (np. resetowanie hasła, weryfikacja adresu e-mail). Adres e-mail jest również przekazywany do Aplikacji Sojusan, z której użytkownik korzysta, i wykorzystywany przez nią wyłącznie na potrzeby wewnętrzne tej aplikacji. Adres e-mail nie jest wykorzystywany do celów marketingowych. Podstawa prawna: art. 6 ust. 1 lit. b RODO.</li>\
<li><strong>Pseudonim (nick)</strong> — dane obowiązkowe, unikalne. Cel: publiczna identyfikacja użytkownika — pseudonim jest widoczny dla innych użytkowników we wszystkich Aplikacjach Sojusan. Podstawa prawna: art. 6 ust. 1 lit. b RODO.</li>\
<li><strong>Płeć</strong> — pole obowiązkowe w formularzu, jednak podanie konkretnej wartości jest w pełni dobrowolne — dostępna jest opcja „Wolę nie podawać”, która nie ujawnia żadnej informacji. Jeżeli użytkownik wskaże płeć, informacja ta jest widoczna publicznie na jego profilu w Aplikacjach Sojusan oraz wykorzystywana wewnętrznie do zbiorczych, statystycznych zestawień dotyczących korzystania z Aplikacji Sojusan. Podstawa prawna: art. 6 ust. 1 lit. a RODO (zgoda) — wyrażana poprzez wskazanie wartości innej niż „Wolę nie podawać”. Zgodę można w każdej chwili wycofać, zmieniając wartość na „Wolę nie podawać” w ustawieniach konta, bez wpływu na zgodność z prawem przetwarzania dokonanego przed jej wycofaniem.</li>\
</ul>\
<p>Płeć nie stanowi szczególnej kategorii danych osobowych w rozumieniu art. 9 RODO.</p>\
<h3>4. Komu przekazujemy dane (odbiorcy danych)</h3>\
<p>Nazwa użytkownika, adres e-mail, pseudonim oraz płeć (o ile została podana) są przekazywane do tej Aplikacji Sojusan, z której użytkownik korzysta i do której loguje się za pomocą Usługi. Adres e-mail jest wykorzystywany przez daną Aplikację Sojusan wyłącznie na jej potrzeby wewnętrzne (np. do obsługi konta użytkownika w tej aplikacji) i nie jest przez nią wykorzystywany do celów marketingowych ani przekazywany dalej. Każda Aplikacja Sojusan jest odrębnym administratorem danych w zakresie przetwarzania danych we własnym serwisie.</p>\
<p>Infrastruktura Usługi jest utrzymywana na serwerze VPS dostarczanym przez OVH (Unia Europejska), który pełni rolę podmiotu przetwarzającego dane w rozumieniu art. 28 RODO. Dane nie są przekazywane poza Europejski Obszar Gospodarczy ani udostępniane innym podmiotom trzecim, w szczególności w celach marketingowych czy reklamowych.</p>\
<h3>5. Okres przechowywania danych</h3>\
<p>Dane są przechowywane przez cały okres istnienia konta. Po usunięciu konta przez użytkownika (samodzielnie, w panelu konta) lub przez Administratora, dane są trwale usuwane z bazy danych Usługi, a informacja o usunięciu konta jest przekazywana do wszystkich Aplikacji Sojusan, które są zobowiązane trwale usunąć dane użytkownika ze swoich systemów.</p>\
<h3>6. Twoje prawa</h3>\
<p>Zgodnie z RODO przysługuje Ci prawo do:</p>\
<ul>\
<li>dostępu do swoich danych osobowych,</li>\
<li>sprostowania (poprawienia) danych — samodzielnie, w panelu konta,</li>\
<li>usunięcia danych ("prawo do bycia zapomnianym") — samodzielnie, poprzez usunięcie konta,</li>\
<li>ograniczenia przetwarzania,</li>\
<li>wniesienia sprzeciwu wobec przetwarzania,</li>\
<li>przenoszenia danych,</li>\
<li>cofnięcia zgody w dowolnym momencie (dotyczy danych przetwarzanych na podstawie zgody, np. płci) — bez wpływu na zgodność z prawem przetwarzania dokonanego przed jej cofnięciem,</li>\
<li>wniesienia skargi do Prezesa Urzędu Ochrony Danych Osobowych (UODO), ul. Stawki 2, 00-193 Warszawa, jeśli uznasz, że przetwarzanie Twoich danych narusza przepisy RODO.</li>\
</ul>\
<p>W celu realizacji powyższych praw skontaktuj się z Administratorem pod adresem: kontakt@sojusan.pl. Dane nie są przetwarzane w sposób zautomatyzowany w celu podejmowania decyzji wywołujących skutki prawne, w tym w celu profilowania.</p>\
<h3>7. Pliki cookies</h3>\
<p>Usługa wykorzystuje wyłącznie pliki cookies niezbędne do jej działania (np. utrzymanie sesji logowania). Usługa nie wykorzystuje plików cookies analitycznych, marketingowych ani śledzących.</p>\
<h3>8. Zmiany dokumentu</h3>\
<p>Administrator zastrzega sobie prawo do zmiany niniejszego dokumentu, w szczególności w przypadku zmiany przepisów prawa lub zakresu funkcjonalności Usługi. O istotnych zmianach użytkownicy zostaną poinformowani przy najbliższym logowaniu.</p>\
<h3>9. Kontakt</h3>\
<p>We wszystkich sprawach dotyczących niniejszego dokumentu oraz przetwarzania danych osobowych można kontaktować się z Administratorem pod adresem e-mail: kontakt@sojusan.pl.</p>
