termsTitle=Terms of Service and Personal Data Processing Notice
termsText=<h2>Sojusan Auth Terms of Service and Personal Data Processing Notice</h2>\
<p>This document sets out the rules for using the Sojusan Auth sign-in and account service ("the Service"), shared across the Sojusan family of applications ("Sojusan Apps"), and explains how personal data is processed in accordance with Regulation (EU) 2016/679 ("GDPR"). This is an English translation provided for convenience; the Polish version is authoritative under Polish law (RODO).</p>\
<h3>1. Data controller</h3>\
<p>The controller of personal data processed within the Service is Sojusan, contact: contact@sojusan.pl. The controller has not appointed a Data Protection Officer — for any matters concerning the processing of personal data, please contact the controller directly at the email address above.</p>\
<h3>2. Creating an account and using the Service</h3>\
<ul>\
<li>Creating an account is voluntary, but necessary to use the Sojusan Apps.</li>\
<li>The Service may be used by individuals who are at least 16 years old. Individuals under 16 may only create an account with the consent of a parent or legal guardian.</li>\
<li>You must provide accurate information and keep your account credentials (password) confidential.</li>\
<li>Your username and nickname must be unique within the Service.</li>\
<li>Creating an account requires accepting this document.</li>\
<li>You may delete your account at any time, yourself, from the Sojusan Auth account console.</li>\
</ul>\
<h3>3. What data we process and why</h3>\
<p>In connection with using the Service, we process the following data:</p>\
<ul>\
<li><strong>Username</strong> — required. Purpose: creating and identifying your account, and authenticating (signing in) to the Service and to any Sojusan App you log into. Legal basis: Art. 6(1)(b) GDPR (necessary to provide the service).</li>\
<li><strong>Email address</strong> — required. Purpose: authentication, confirming account creation, and sending account-security messages (e.g. password reset, email verification). Your email address is also shared with the Sojusan App you use, which uses it solely for its own internal purposes. Your email address is not used for marketing purposes. Legal basis: Art. 6(1)(b) GDPR.</li>\
<li><strong>Nickname</strong> — required, unique. Purpose: publicly identifying you — your nickname is visible to other users across all Sojusan Apps. Legal basis: Art. 6(1)(b) GDPR.</li>\
<li><strong>Gender</strong> — the form field is mandatory, but providing an actual value is entirely voluntary — a "Prefer not to say" option is available that discloses no information. If you do provide a gender, it is shown publicly on your profile within the Sojusan Apps and is also used internally for aggregate, statistical purposes about how the Sojusan Apps are used. Legal basis: Art. 6(1)(a) GDPR (consent) — given by selecting a value other than "Prefer not to say". You may withdraw this consent at any time by changing the value back to "Prefer not to say" in your account settings, without affecting the lawfulness of processing carried out before withdrawal.</li>\
</ul>\
<p>Gender is not a special category of personal data within the meaning of Art. 9 GDPR.</p>\
<h3>4. Who we share data with (recipients)</h3>\
<p>Your username, email address, nickname, and gender (if provided) are shared with the specific Sojusan App you use and log into via the Service. Your email address is used by that Sojusan App solely for its own internal purposes (e.g. managing your account within that app), and is not used by it for marketing or shared onward. Each Sojusan App is a separate, independent data controller for the processing it carries out within its own service.</p>\
<p>The Service's infrastructure is hosted on a VPS provided by OVH (European Union), which acts as a data processor within the meaning of Art. 28 GDPR. Data is not transferred outside the European Economic Area, nor is it shared with any other third parties, in particular for marketing or advertising purposes.</p>\
<h3>5. How long we keep your data</h3>\
<p>Data is retained for as long as your account exists. Once you delete your account (yourself, from the account console) or it is deleted by the controller, your data is permanently erased from the Service's database, and notice of the deletion is propagated to every Sojusan App, each of which is required to permanently erase your data from its own systems.</p>\
<h3>6. Your rights</h3>\
<p>Under GDPR you have the right to:</p>\
<ul>\
<li>access your personal data,</li>\
<li>rectify (correct) your data — yourself, from the account console,</li>\
<li>erase your data ("the right to be forgotten") — yourself, by deleting your account,</li>\
<li>restrict processing,</li>\
<li>object to processing,</li>\
<li>data portability,</li>\
<li>withdraw consent at any time (for data processed on the basis of consent, e.g. gender) — without affecting the lawfulness of processing carried out before withdrawal,</li>\
<li>lodge a complaint with the Polish supervisory authority (Prezes Urzędu Ochrony Danych Osobowych, UODO), ul. Stawki 2, 00-193 Warszawa, Poland, or with the supervisory authority of your own EU member state, if you believe the processing of your data infringes GDPR.</li>\
</ul>\
<p>To exercise the rights above, contact the controller at: contact@sojusan.pl. Your data is not subject to automated decision-making producing legal effects, including profiling.</p>\
<h3>7. Cookies</h3>\
<p>The Service uses only cookies strictly necessary for it to function (e.g. maintaining your login session). The Service does not use analytics, marketing, or tracking cookies.</p>\
<h3>8. Changes to this document</h3>\
<p>The controller reserves the right to amend this document, in particular in response to changes in the law or in the Service's functionality. Users will be notified of material changes the next time they sign in.</p>\
<h3>9. Contact</h3>\
<p>For any matters concerning this document or the processing of personal data, contact the controller at: contact@sojusan.pl.</p>
