<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="150 135 900 350">
  <defs>
    <!-- Mantine primary colors (default blue scale approx) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#339af0" /> <!-- primary-5 -->
      <stop offset="100%" stop-color="#1c7ed6" /> <!-- primary-7 -->
    </linearGradient>
  </defs>

  <g transform="translate(600, 315)" text-anchor="middle">
    <!-- Sojusan -->
    <text
      y="-20"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-weight="800"
      font-style="italic"
      font-size="160"
      fill="url(#primaryGrad)"
      letter-spacing="16">
      Sojusan
    </text>

    <!-- Auth -->
    <text
      y="120"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-weight="600"
      font-size="100"
      fill="#e03131"
      letter-spacing="22">
      Auth
    </text>
  </g>
</svg>
